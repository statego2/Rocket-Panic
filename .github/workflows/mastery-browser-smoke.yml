name: Mastery portrait browser smoke
on:
  pull_request:
    branches: [mastery-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and select preinstalled Chrome
        run: |
          npm install --no-save playwright
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            echo "MASTERY_SYSTEM_CHROME=$CHROME" >> "$GITHUB_ENV"
            echo "Using runner's preinstalled Chrome: $CHROME"
          else
            npx playwright install chromium
          fi
      - name: Smoke launch and Field V on a portrait touch viewport
        run: |
          python3 -m http.server 8765 >/tmp/mastery-http.log 2>&1 &
          node tests/mastery-browser-smoke.mjs
      - name: Archive launch and Field V screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastery-portrait-browser-smoke
          path: test-artifacts/
          if-no-files-found: ignore
